name: Desplegar GCP

on:
  # Un merge de PR también genera push. El filtro dinámico está en validate.
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gcp-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    name: Validar GCP
    if: >-
      github.event.deleted != true &&
      (github.event_name == 'pull_request' || github.ref_type == 'branch') &&
      ((github.base_ref || github.ref_name) == 'main' ||
       (github.base_ref || github.ref_name) == 'master' ||
       (github.base_ref || github.ref_name) == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: bash -n scripts/update-vm.sh
      - name: Empaquetar el commit para GCP
        run: git archive --format=tar.gz --output=release.tar.gz HEAD .dockerignore Dockerfile package.json package-lock.json server.js src public deploy scripts/update-vm.sh
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: gcp-${{ github.sha }}
          path: release.tar.gz
          retention-days: 7

  deploy:
    name: Publicar GCP
    needs: validate
    # Si validate se omite por la rama, este job también se omite.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
      APP_RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: gcp-${{ github.sha }}
      - name: Preparar acceso a GCP
        run: |
          for key in VM_HOST VM_USER VM_SSH_KEY VM_KNOWN_HOSTS; do
            test -n "${!key}" || { echo "::error::Falta el secreto $key"; exit 1; }
          done
          [[ "$VM_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$VM_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/comunidad_ci
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/comunidad_ci ~/.ssh/known_hosts
          printf 'Host produccion\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/comunidad_ci\n  IdentitiesOnly yes\n  BatchMode yes\n  StrictHostKeyChecking yes\n  ConnectTimeout 20\n' "$VM_HOST" "$VM_USER" > ~/.ssh/config
      - name: Actualizar la aplicación y hacer backup
        run: |
          remote="/home/$VM_USER/comunidad/releases/$GITHUB_SHA"
          ssh produccion "umask 077; mkdir -p '$remote'"
          scp release.tar.gz "produccion:$remote/source.tar.gz"
          ssh produccion "set -e; tar -xzf '$remote/source.tar.gz' -C '$remote'; bash '$remote/scripts/update-vm.sh' '$GITHUB_SHA' '/home/$VM_USER/comunidad'"
      - name: Verificar GCP por HTTPS
        run: node scripts/verify-production.mjs https://penarrubia.35.209.188.202.sslip.io
      - name: Resumir GCP
        if: always()
        env:
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          printf 'GCP: **%s**\n\nRama: `%s`\n\nCommit: `%s`\n\nhttps://penarrubia.35.209.188.202.sslip.io\n' "$DEPLOY_STATUS" "$GITHUB_REF_NAME" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Retirar la clave temporal del runner
        if: always()
        run: rm -f ~/.ssh/comunidad_ci
