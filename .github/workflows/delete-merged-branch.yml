name: Borrar rama al fusionar

# La opción nativa "Automatically delete head branches" solo puede activarla quien
# administra el repositorio, así que la limpieza se hace desde el propio repositorio.
# Si algún día se activa esa opción, este flujo simplemente no encuentra nada que borrar.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    name: Borrar rama fusionada
    # Solo PR fusionados, de ramas del mismo repositorio y que no sean la principal.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Borrar la rama de origen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -uo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "La rama \`${BRANCH}\` ya no existía." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"; then
            echo "Rama \`${BRANCH}\` borrada al fusionar el PR." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No se pudo borrar la rama ${BRANCH}: puede estar protegida."
            echo "No se pudo borrar la rama \`${BRANCH}\`; revisar si está protegida." >> "$GITHUB_STEP_SUMMARY"
          fi
