server {
  listen 80;
  server_name penarrubia.35.209.188.202.sslip.io;
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme;
    default_type text/plain;
    try_files $uri =404;
  }
  location / { return 308 https://penarrubia.35.209.188.202.sslip.io$request_uri; }
}
server {
  listen 8443 ssl;
  server_name penarrubia.35.209.188.202.sslip.io;
  ssl_certificate /etc/letsencrypt/live/comunidad-vecinos/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/comunidad-vecinos/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 112m;
  location / {
    set $comunidad_backend http://comunidad-api:3000;
    proxy_pass $comunidad_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 180s;
  }
}
