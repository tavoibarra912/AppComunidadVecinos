# Insertar SOLO en el server HTTPS de la VM, antes de location /.
# Reutiliza IP/certificado/puertos existentes; el backend no publica puertos nuevos.
location ^~ /comunidad/ {
  set $comunidad_backend http://comunidad-api:3000;
  rewrite ^/comunidad/(.*)$ /$1 break;
  proxy_pass $comunidad_backend;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  # Sin confiar en X-Forwarded-For de Internet. El límite de IP será compartido
  # por los proxies; los límites por identidad siguen siendo independientes.
  proxy_set_header X-Forwarded-For "";
  proxy_set_header Origin $http_origin;
  proxy_read_timeout 25s;
  proxy_hide_header X-Powered-By;
  add_header Cache-Control "no-store" always;
}
